name: Mirror main from Buzz

# Pulls main from the Buzz-hosted origin and fast-forwards GitHub main.
#
# Direction is Buzz -> GitHub, one way. Buzz is the primary remote; GitHub is
# the mirror. No GitHub write credential exists outside GitHub: the push uses
# the built-in GITHUB_TOKEN. The only secret is BUZZ_MIRROR_NSEC, a Buzz read
# key for the mirror-bot identity, which grants nothing on GitHub.

on:
  schedule:
    # Best-effort. GitHub delays cron under load, so treat this as "within
    # ~10-30 min", not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: buzz-mirror-main
  cancel-in-progress: false

env:
  # Owner is the 64-char hex pubkey that announced the repo, not a username.
  BUZZ_REPO_URL: https://buzz.gitcoin.co/git/20498bf7727e4c607731692863a5c8bcc0aca892272be392cb05758f45d92c1d/buzz-mirror-bot.git
  # Pin the helper build so a bad upstream commit can't silently change auth.
  BUZZ_COMMIT: 24d90d1280a9325c6cbcf8eea30ac54db5afd2cb

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the ancestry check below can resolve both tips.
          fetch-depth: 0

      - name: Check git supports the authtype capability
        run: |
          # The NIP-98 helper silently no-ops on git < 2.46: older git never
          # sends the credential protocol's capability[]=authtype line.
          ver=$(git --version | awk '{print $3}')
          if [ "$(printf '%s\n2.46.0\n' "$ver" | sort -V | head -1)" != "2.46.0" ]; then
            echo "::error::git $ver is too old — git-credential-nostr needs >= 2.46"
            exit 1
          fi

      - name: Cache credential helper
        id: helper-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/git-credential-nostr
          key: git-credential-nostr-${{ env.BUZZ_COMMIT }}-${{ runner.os }}

      - name: Build credential helper
        if: steps.helper-cache.outputs.cache-hit != 'true'
        run: |
          cargo install --git https://github.com/block/buzz \
            --rev "$BUZZ_COMMIT" git-credential-nostr --locked

      - name: Fetch main from Buzz
        env:
          # Read-only in practice: Buzz branch protection on main is push:owner,
          # and this identity is not the repo owner.
          NOSTR_PRIVATE_KEY: ${{ secrets.BUZZ_MIRROR_NSEC }}
          # NIP-OA owner attestation. The helper folds this into the signed
          # NIP-98 event (git's credential protocol cannot add a separate
          # header), which is what gets mirror-bot through the relay's
          # membership door via its owner instead of enrolling it separately.
          BUZZ_AUTH_TAG: ${{ secrets.BUZZ_MIRROR_AUTH_TAG }}
        run: |
          git config --global credential.helper nostr
          git config --global credential.useHttpPath true
          git remote add buzz "$BUZZ_REPO_URL" 2>/dev/null \
            || git remote set-url buzz "$BUZZ_REPO_URL"
          git fetch --no-tags buzz refs/heads/main:refs/remotes/buzz/main

      - name: Fast-forward GitHub main
        run: |
          set -euo pipefail

          # Fetch GitHub's current main into a local ref. This gives the live
          # value (the checkout ref can be stale) and guarantees the object is
          # present, so the ancestry check can never die with "not a valid
          # commit name" when main moved after checkout.
          git fetch --no-tags --force origin \
            "refs/heads/main:refs/remotes/origin/main" 2>/dev/null || true

          buzz_main=$(git rev-parse refs/remotes/buzz/main)
          github_main=$(git rev-parse -q --verify refs/remotes/origin/main || true)

          if [ -z "$github_main" ]; then
            echo "main does not exist on GitHub yet — creating it at $buzz_main"
          elif [ "$github_main" = "$buzz_main" ]; then
            echo "already in sync at $buzz_main"
            exit 0
          elif ! git merge-base --is-ancestor "$github_main" "$buzz_main"; then
            echo "::error::GitHub main ($github_main) is not an ancestor of Buzz main ($buzz_main) — histories diverged. Reconcile by hand; this job will not force-push."
            exit 1
          fi

          # Plain non-force push. Even if the check above raced, the server
          # rejects a non-fast-forward, so this can never rewrite main.
          git push origin "$buzz_main:refs/heads/main"
          echo "main: ${github_main:-<none>} -> $buzz_main"
