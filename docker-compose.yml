# Coolify application definition for the mirror daemon.
#
# Create this once in Coolify, then `tofu import` it into
# agentic-engineering-infra when the OpenTofu migration reaches it - the
# coolify-terraform/coolify provider supports import on every stateful resource,
# so building it here now costs no rework later.
#
# Adding a repo to the mirror is a tick in the GitHub App's install UI. There is
# no repo list here: the mirror set is discovered as the intersection of "granted
# to the App" and "announced on Buzz with a GitHub `web` tag". Nothing is added
# to the mirrored repo itself, and nothing here needs editing or redeploying.
#
# Deployed shape, and the reason for the odd-looking `command`:
#
#   main process    sleep infinity                   (below)
#   scheduled task  /app/mirror/entrypoint.sh --once (created in the Coolify UI)
#
# Coolify's scheduled tasks `docker exec` into a *running* container rather than
# starting one, and Coolify has no host-level cron, so the container has to stay
# up even though the mirror itself is a one-shot. The exit status of `--once` is
# then the alert (Scheduled Task Failure) - and because the exec also fails when
# no container is running, that one path covers liveness too. No healthcheck, no
# staleness probe, no second task watching the first.
#
# To run the loop instead - anywhere without a scheduler - drop `command` and
# restore the HEALTHCHECK; see docs/MIRROR.md.

services:
  mirror:
    build: .
    restart: unless-stopped
    # See the header: the reconcile runs as a Coolify scheduled task, and this
    # only exists to give that task a container to exec into.
    command: ["sleep", "infinity"]
    environment:
      # --- identity -----------------------------------------------------
      # Buzz key for the mirror-bot identity. Needs to be a member of every
      # bound channel: git read on Buzz is membership-gated, so losing channel
      # membership presents as a 404 on fetch, not as an auth error.
      BUZZ_PRIVATE_KEY: ${BUZZ_PRIVATE_KEY:?}
      BUZZ_AUTH_TAG: ${BUZZ_AUTH_TAG:?}
      BUZZ_RELAY_URL: https://buzz.gitcoin.co

      # GitHub App. The PEM arrives as an env var and the entrypoint moves it to
      # a 0400 tmpfs file immediately - see entrypoint.sh for why that is a
      # compromise rather than a solution.
      GITHUB_APP_ID: ${GITHUB_APP_ID:?}
      # base64 of the .pem. Preferred over GITHUB_APP_PEM because a PEM is
      # multi-line and Coolify's env var field is not: base64 survives the form
      # with no escaping question. Generate with:
      #   base64 -w0 your-app.private-key.pem
      GITHUB_APP_PEM_B64: ${GITHUB_APP_PEM_B64:?}

      # --- what to mirror -----------------------------------------------
      # The only knob: whose Buzz repo announcements to read. Everything else
      # is discovered. MIRROR_ONLY (a JSON array of buzz repo-ids) exists to
      # point a test deployment at one scratch repo; leave it unset in prod.
      BUZZ_REPO_OWNER: 20498bf7727e4c607731692863a5c8bcc0aca892272be392cb05758f45d92c1d

      # Where halt and recovery messages go.
      MIRROR_ALERT_CHANNEL: ffaf8f45-5aad-4a8a-9b57-c0ae343709b7

      # Loop mode only; ignored by --once, where Coolify's cron sets the pace.
      MIRROR_INTERVAL_SECS: "60"

    volumes:
      # Bare clones + sticky halt state. Must persist across restarts, or a
      # restart re-posts every active halt.
      - mirror-state:/var/lib/git-mirror

    tmpfs:
      # uid must match the pinned uid in the Dockerfile.
      - /run/mirror:mode=700,uid=10001

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mirror-state:
